name: Deploy VinylCollection to Azure

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC login to Azure
  contents: read

env:
  RESOURCE_GROUP: slk-vc-rg-uks

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Publish
        run: dotnet publish FRONTEND/FRONTEND.csproj -c Release -o ${{ runner.temp }}/app

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: ${{ runner.temp }}/app

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure
        id: infra
        run: |
          appName=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --query properties.outputs.appName.value -o tsv)
          echo "appName=$appName" >> "$GITHUB_OUTPUT"

      - name: Download app artifact
        uses: actions/download-artifact@v4
        with:
          name: app
          path: app

      - name: Deploy app
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.infra.outputs.appName }}
          package: app
